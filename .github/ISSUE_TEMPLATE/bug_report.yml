name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here: report them privately at https://github.com/TEitelberg/aantje/security/advisories/new (see SECURITY.md). Never paste passwords, S3 keys or catalog contents.
  - type: input
    id: version
    attributes:
      label: aantje version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: VS Code or code-server version, and platform
      placeholder: VS Code 1.140 on Windows x64
    validations:
      required: true
  - type: dropdown
    id: catalog
    attributes:
      label: Catalog kind
      options: [PostgreSQL, SQLite, DuckDB, Not related to a catalog]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Output channel "aantje"
      description: Passwords are masked in this channel; check the text before you paste it.
      render: text

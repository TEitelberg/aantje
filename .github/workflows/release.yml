name: Release

# Every change that is merged into main builds a release: the version is the newest v-tag with the patch part counted up
# (a pull request label release:minor or release:major counts that part instead), both platform packages are built on
# their own platform, and the tag and a GitHub pre-release with the packages are created. main is protected, so the
# version lives in the tag, never in a commit. A change that touches only docker/ or .github/ is no release (start one by
# hand with the manual run).
#
# Open VSX gets a version only when the owner releases it on purpose: a pre-release on GitHub is turned into a release
# (Releases, edit, remove the tick of "Set as a pre-release"). That event starts the last job, which publishes the two
# packages of the release. A release that the workflow created itself could not start it, its token triggers no events.
on:
  push:
    branches: [main]
    paths-ignore: ['docker/**', '.github/**']
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to count up
        type: choice
        options: [patch, minor, major]
        default: patch
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          bump=patch
          if [ "$EVENT" = workflow_dispatch ]; then
            bump="$INPUT_BUMP"
          else
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[].labels[].name')
            if grep -qx 'release:major' <<<"$labels"; then bump=major
            elif grep -qx 'release:minor' <<<"$labels"; then bump=minor
            fi
          fi
          published=$(curl -fsS https://open-vsx.org/api/teitelberg/aantje | jq -r '.version // empty' || true)
          version=$(node scripts/next-version.mjs "$bump" --published "$published")
          echo "Releasing $version ($bump)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # vsce package runs the build itself (vscode:prepublish).
      - run: node scripts/marketplace-readme.mjs
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: npx --no-install vsce package "$VERSION" --target "$TARGET" --no-update-package-json --no-git-tag-version --readme-path out/marketplace-readme.md --out "aantje-$TARGET-$VERSION.vsix"
      # The same content check as a local build: only the allowed files, one DuckDB binding for the target.
      - name: Check the contents
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: ./scripts/check-vsix.ps1 -Vsix "aantje-$env:TARGET-$env:VERSION.vsix" -Platform $env:TARGET
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: '*.vsix'
          if-no-files-found: error

  pre-release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          merge-multiple: true
      - name: Tag and pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "v$VERSION" aantje-*.vsix --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes --prerelease

  open-vsx:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download the packages of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'aantje-*.vsix'
          count=$(ls aantje-*.vsix | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::The release $TAG has $count packages instead of the two aantje-<platform>-<version>.vsix."
            exit 1
          fi
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::The secret OVSX_PAT is not set."
            exit 1
          fi
          for package in aantje-*.vsix; do
            npx --yes ovsx@1.3.0 publish "$package" -p "$OVSX_PAT"
          done

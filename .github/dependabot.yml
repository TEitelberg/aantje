version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 waits for typescript-eslint, whose peer range ends below 6.1 (issue #1).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The type packages follow the oldest supported runtime, not the newest release.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/vscode'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
